<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>TattsBySean | Tattoo Artist</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

  <!-- ✅ FIXED PATH TO CSS -->
  <link rel="stylesheet" href="css/style.css">
</head>

<body>

  <div class="smoke-bg"></div>

  <header class="navbar">
    <div class="nav-wrapper">
      <div class="logo">TattsBy<span>Sean</span></div>
    </div>
  </header>

  <section class="hero">

    <div class="hero-content">

      <h1 class="reveal">Ink With Purpose</h1>

      <p class="reveal">
        Black & grey realism, lettering, and custom tattoo designs built to last.
      </p>

      <div class="hero-buttons reveal">
        <a href="#work" class="btn primary-btn">View Work</a>
        <a href="#booking" class="btn secondary-btn">Book Now</a>
      </div>

    </div>

  </section>

  <section class="social-gallery reveal" id="work">

    <h2>Latest Work</h2>

    <div class="grid">
  <img src="images/tattoo1.jpg">
  <img src="images/tattoo2.jpg">
  <img src="images/tattoo3.jpg">
</div>

  </section>

  <section class="tiktok-section reveal">

    <h2>Behind the Ink</h2>

    <div class="videos">

      <iframe src="https://www.tiktok.com/embed/v2/VIDEO_ID_1"></iframe>
      <iframe src="https://www.tiktok.com/embed/v2/VIDEO_ID_2"></iframe>
      <iframe src="https://www.tiktok.com/embed/v2/VIDEO_ID_3"></iframe>

    </div>

  </section>

  <section class="booking" id="booking">

    <form class="reveal">
      <input type="text" placeholder="Name">
      <input type="email" placeholder="Email">
      <textarea placeholder="Tattoo idea..."></textarea>
      <button class="btn primary-btn">Send</button>
    </form>

  </section>

  <footer>
    <div class="footer-logo">TattsBySean</div>
  </footer>

  <!-- ✅ FIXED PATH TO JS -->
  <script src="js/script.js"></script>

</body>
</html>
