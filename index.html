!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TattsBySean</title>

    <link rel="stylesheet" href="css/style.css">

    <link href="https://fonts.googleapis.com/css2?family=UnifrakturMaguntia&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body>

    <div class="smoke-bg"></div>

    <section class="hero">
        <div class="hero-content">
            <h1 class="logo reveal">TattsBySean</h1>
            <p class="tagline reveal">Custom Tattoos</p>
        </div>
    </section>

    <section class="about reveal">
        <h2>About Sean</h2>
        <p>
            Specializing in custom black and grey tattoo work,
            realism, anime, color, and unique pieces designed specifically
            for each client.
        </p>
    </section>

    <section class="slideshow-section reveal">
        <h2 class="section-title">Featured Work</h2>

        <div class="slideshow-container">
            <img src="images/tattoo1.jpg" class="slide active" alt="Tattoo 1">
            <img src="images/tattoo2.jpg" class="slide" alt="Tattoo 2">
            <img src="images/tattoo3.jpg" class="slide" alt="Tattoo 3">
            <img src="images/tattoo4.jpg" class="slide" alt="Tattoo 4">
            <img src="images/tattoo5.jpg" class="slide" alt="Tattoo 5">
            <img src="images/tattoo6.jpg" class="slide" alt="Tattoo 6">
            <img src="images/tattoo7.jpg" class="slide" alt="Tattoo 7">
            <img src="images/tattoo8.jpg" class="slide" alt="Tattoo 8">
            <img src="images/tattoo9.jpg" class="slide" alt="Tattoo 9">
            <img src="images/tattoo10.jpg" class="slide" alt="Tattoo 10">
            <img src="images/tattoo11.jpg" class="slide" alt="Tattoo 11">
          </div>
    </section>

    <footer>

        <div class="footer-booking">
            <h2>Ready For Your Next Tattoo?</h2>

            <a
                href="https://form.jotform.com/242626712669161?utm_source=ig&utm_medium=social&utm_content=link_in_bio&utm_id=97760_v0_s00_e0_tv3"
                target="_blank"
                class="footer-book-btn">
                Book
            </a>
        </div>

        <h3>TattsBySean</h3>

        <div class="socials">

            <a
                href="https://www.instagram.com/tattsbysean/"
                target="_blank"
                aria-label="Instagram">
                <i class="fa-brands fa-instagram"></i>
            </a>

            <a
                href="https://www.tiktok.com/@tattsbysean"
                target="_blank"
                aria-label="TikTok">
                <i class="fa-brands fa-tiktok"></i>
            </a>

        </div>

    </footer>

    <script src="js/script.js"></script>

</body>

</html>
