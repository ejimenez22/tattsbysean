<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TattsBySean</title>

    <link rel="stylesheet" href="css/style.css">

    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&display=swap" rel="stylesheet">
</head>

<body>

    <!-- Smoke Background -->
    <div class="smoke-bg"></div>

    <!-- Hero -->
    <section class="hero">

        <div class="hero-content">

            <h1 class="logo reveal">
                TattsBySean
            </h1>

            <p class="tagline reveal">
                Custom Black & Grey Tattoos
            </p>

            <a href="#booking" class="btn reveal">
                Book Now
            </a>

        </div>

    </section>

    <!-- About -->

    <section class="about reveal">

        <h2>About Sean</h2>

        <p>
            Specializing in custom black and grey tattoo work,
            realism, lettering, and unique pieces designed specifically
            for each client.
        </p>

    </section>

    <!-- Slideshow -->

    <section class="slideshow-section reveal">

        <h2 class="section-title">
            Featured Work
        </h2>

        <div class="slideshow-container">

            <img src="images/tattoo1.jpg" class="slide active">

            <img src="images/tattoo2.jpg" class="slide">

            <img src="images/tattoo3.jpg" class="slide">

        </div>

    </section>

    <!-- Booking -->

    <section id="booking" class="booking reveal">

        <h2>Book a Session</h2>

        <form>

            <input
                type="text"
                placeholder="Name"
                required>

            <input
                type="email"
                placeholder="Email"
                required>

            <textarea
                rows="5"
                placeholder="Tell me about your tattoo idea">
            </textarea>

            <button type="submit">
                Submit Inquiry
            </button>

        </form>

    </section>

    <!-- Footer -->

    <footer>

        <h3>TattsBySean</h3>

        <div class="socials">

            <a href="https://www.instagram.com/tattsbysean/" target="_blank">
                Instagram
            </a>

            <a href="https://www.tiktok.com/@tattsbysean" target="_blank">
                TikTok
            </a>

        </div>

    </footer>

    <script src="js/script.js"></script>

</body>

</html>
